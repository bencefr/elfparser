name: Publish to npm

on:
    workflow_dispatch:
        inputs:
            tag:
                description: Git tag of the release asset to publish
                required: true
                type: string

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org

            - name: Download release package
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ inputs.tag }}
              run: |
                  mkdir package
                  gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.tgz" --dir package --clobber
                  package_file=$(find package -maxdepth 1 -type f -name "*.tgz" -print -quit)
                  test -n "$package_file"
                  echo "PACKAGE_FILE=$package_file" >> "$GITHUB_ENV"

            - name: Publish package
              run: npm stage publish "$PACKAGE_FILE" --provenance --access public

name: Release artifact

on:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    release-artifact:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  cache: npm

            - name: Set up Rust
              uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
              with:
                  targets: wasm32-unknown-unknown

            - name: Install Cargo dependencies
              run: cargo fetch --manifest-path wasm-elf-parser/Cargo.toml

            - name: Cache Cargo dependencies
              uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
              with:
                  workspaces: wasm-elf-parser -> target

            - name: Install wasm-bindgen CLI
              run: cargo install wasm-bindgen-cli --locked

            - name: Install Node dependencies
              run: npm ci

            - name: Build package
              run: npm run build

            - name: Create release artifact
              id: package
              shell: bash
              run: |
                  package_json=$(npm pack --ignore-scripts --json)
                  echo "filename=$(echo "$package_json" | jq -r '.[0].filename')" >> "$GITHUB_OUTPUT"
                  version=$(node -p "require('./package.json').version")
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release create "v${{ steps.package.outputs.version }}" "${{ steps.package.outputs.filename }}" --title "elfparser v${{ steps.package.outputs.version }}" --generate-notes
